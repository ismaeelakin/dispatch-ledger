<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="275" viewBox="0 0 1000 275" role="img" aria-labelledby="title desc"><title id="title">Webhook delivery path</title><desc id="desc">HTTP requests run outside the database transaction. Replay retains previous attempts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#9c3b13"/></marker></defs><rect width="1000" height="275" fill="#f1f2ef"/><g font-family="Verdana, sans-serif"><text x="25" y="44" font-size="24" fill="#152f40">Webhook delivery path</text><rect x="25" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="40" y="135" font-size="18" fill="#152f40">Tenant request</text><text x="40" y="165" font-size="13" fill="#3f4e57">Token and input checks</text><path d="M234 150 h26" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="280" y="135" font-size="18" fill="#152f40">SQLite transaction</text><text x="280" y="165" font-size="13" fill="#3f4e57">Event + deliveries + audit</text><path d="M474 150 h26" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><rect x="505" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="520" y="135" font-size="18" fill="#152f40">Delivery worker</text><text x="520" y="165" font-size="13" fill="#3f4e57">Claim, sign, send, record</text><path d="M714 150 h26" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><rect x="745" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="760" y="135" font-size="18" fill="#152f40">Named HTTP target</text><text x="760" y="165" font-size="13" fill="#3f4e57">Retry or finish delivery</text><text x="25" y="248" font-size="13" fill="#3f4e57">HTTP requests run outside the database transaction. Replay retains previous attempts.</text></g></svg>
