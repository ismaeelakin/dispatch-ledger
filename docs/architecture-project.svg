<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">Dispatch Ledger transaction and delivery boundaries</title><desc id="desc">Acceptance commits before the worker claims a delivery. Signed HTTP attempts run outside the transaction and their outcomes are stored.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#e6c379"/></marker></defs>
<rect width="1100" height="470" fill="#162f40"/><g font-family="Franklin Gothic Medium, Arial Narrow, Arial, sans-serif" fill="#edf1f3" color="#edf1f3"><rect x="0" y="0" width="1100" height="470" fill="#162f40" stroke="none" stroke-dasharray=""/><text x="32" y="48" font-size="29" fill="#fff" font-weight="bold" text-anchor="start">DISPATCH LEDGER</text><text x="32" y="77" font-size="17" fill="#d5ac54" font-weight="normal" text-anchor="start">Acceptance, delivery and recovery</text><rect x="30" y="110" width="450" height="210" fill="#213f52" stroke="#b0c1cc" stroke-dasharray="6 5"/><text x="50" y="137" font-size="13" fill="#e6c379" font-weight="bold" text-anchor="start">REQUEST + DATABASE BOUNDARY</text><rect x="55" y="160" width="175" height="105" fill="#edf1f3" stroke="none" stroke-dasharray=""/><text x="70" y="193" font-size="22" fill="#162f40" font-weight="bold" text-anchor="start">Tenant API</text><text x="70" y="222" font-size="14" fill="#162f40" font-weight="normal" text-anchor="start">Token + validation</text><rect x="280" y="160" width="175" height="105" fill="#edf1f3" stroke="none" stroke-dasharray=""/><text x="294" y="189" font-size="21" fill="#162f40" font-weight="bold" text-anchor="start">SQLite commit</text><text x="294" y="218" font-size="14" fill="#162f40" font-weight="normal" text-anchor="start">Event / deliveries</text><text x="294" y="242" font-size="14" fill="#162f40" font-weight="normal" text-anchor="start">Acceptance audit</text><path d="M230 210 H278" fill="none" stroke="#e6c379" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="160" width="205" height="105" fill="#d5ac54" stroke="none" stroke-dasharray=""/><text x="569" y="192" font-size="24" fill="#162f40" font-weight="bold" text-anchor="start">Worker</text><text x="569" y="222" font-size="15" fill="#162f40" font-weight="normal" text-anchor="start">Claim lease, sign body</text><text x="569" y="245" font-size="14" fill="#162f40" font-weight="normal" text-anchor="start">Bound concurrent sends</text><rect x="840" y="160" width="225" height="105" fill="#edf1f3" stroke="none" stroke-dasharray=""/><text x="860" y="192" font-size="23" fill="#162f40" font-weight="bold" text-anchor="start">Named target</text><text x="860" y="222" font-size="16" fill="#162f40" font-weight="normal" text-anchor="start">HTTP receiver</text><path d="M455 210 H548" fill="none" stroke="#e6c379" stroke-width="2" marker-end="url(#arrow)"/><text x="485" y="192" font-size="13" fill="#edf1f3" font-weight="normal" text-anchor="start">claim</text><path d="M755 210 H838" fill="none" stroke="#e6c379" stroke-width="2" marker-end="url(#arrow)"/><text x="775" y="192" font-size="13" fill="#edf1f3" font-weight="normal" text-anchor="start">HMAC</text><path d="M950 265 V360 H370 V267" fill="none" stroke="#e6c379" stroke-width="2" marker-end="url(#arrow)"/><text x="535" y="345" font-size="17" fill="#edf1f3" font-weight="normal" text-anchor="start">Record response, retry or dead letter</text><text x="32" y="425" font-size="17" fill="#edf1f3" font-weight="normal" text-anchor="start">HTTP runs outside the transaction. A replay keeps earlier attempts and records its reason.</text></g></svg>
